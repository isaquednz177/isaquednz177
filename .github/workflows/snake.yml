# Gera a cobrinha comendo os commits (na moldura do dragão), a faixa e o painel de estatísticas do README,
# e publica tudo na branch "output".

name: Cobrinha e estatísticas

on:
  schedule:
    # roda a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch: # permite rodar manualmente na aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # antes da cobrinha: a ação dela roda em Docker e deixa a pasta dist só para o root
      - name: Gerar a faixa de estatísticas
        run: |
          pip install fonttools brotli
          python arte/estatisticas.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar a cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-sangue.svg?color_snake=#E8333A&color_dots=#300C0E,#5A1216,#8B0A14,#B3121E,#D8242A

      # a ação da cobrinha deixa a pasta dist só para o root: devolve para o usuário do runner
      - name: Pôr a cobrinha na moldura do dragão
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          python arte/cobra.py dist/snake-sangue.svg dist/cobra-v1.svg

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
