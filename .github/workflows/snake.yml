# Gera a cobrinha comendo os commits e a faixa de estatísticas do README,
# e publica as duas na branch "output".

name: Cobrinha e estatísticas

on:
  schedule:
    # roda a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch: # permite rodar manualmente na aba Actions
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # antes da cobrinha: a ação dela roda em Docker e deixa a pasta dist só para o root
      - name: Gerar a faixa de estatísticas
        run: |
          pip install fonttools brotli
          python arte/estatisticas.py dist/estatisticas.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar a cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-sangue.svg?color_snake=#B3121E&color_dots=#160D09,#3B1F14,#5C1A14,#8B0A14,#C41E2A

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
